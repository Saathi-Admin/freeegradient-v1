<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="none">
  <defs>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(800 -430) scale(1350 1350)">
      <stop offset="0" stop-color="#a3dd3b"/>
      <stop offset=".38" stop-color="#a3dd3b"/>
      <stop offset=".56" stop-color="#d9fac5"/>
      <stop offset=".7" stop-color="#109e72"/>
      <stop offset=".96" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </radialGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="1700"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="fade" x2="0" y2="1"><stop offset=".4" stop-color="white"/><stop offset=".95" stop-color="black"/></linearGradient>
    <mask id="grain-mask"><rect width="1600" height="900" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1600" height="900" fill="#0a0a0b"/>
  <rect x="-300" y="-300" width="2200" height="1500" fill="url(#halo)" opacity=".78" filter="url(#soft)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity=".055" mask="url(#grain-mask)"/>
</svg>
